<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9哥下班一起喝大象 🍻</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff3c4;
  }

  .text {
    position: fixed;
    left: -400px;
    top: -100px;
    white-space: nowrap;
    font-size: 32px;
    font-weight: 900;
    color: #b45309;
    text-shadow: 2px 2px 0 #fff, 4px 4px 8px #999;
    pointer-events: none;

    animation: move linear forwards;
  }

  @keyframes move {
    0% {
      transform: translate(-10vw, -10vh)
                 rotate(-20deg)
                 scale(.5);
      opacity: 0;
    }

    15% {
      opacity: 1;
    }

    50% {
      transform: translate(50vw, 50vh)
                 rotate(15deg)
                 scale(1.3);
    }

    100% {
      transform: translate(120vw, 115vh)
                 rotate(400deg)
                 scale(.7);
      opacity: 0;
    }
  }

  #center {
    position: fixed;
    z-index: 9999;
    width: 100%;
    top: 42%;
    text-align: center;

    font-size: clamp(30px, 7vw, 80px);
    font-weight: 900;
    color: #92400e;

    text-shadow:
      3px 3px 0 white,
      6px 6px 15px #888;

    animation: bounce .8s infinite alternate;
  }

  @keyframes bounce {
    from {
      transform: scale(1) rotate(-2deg);
    }

    to {
      transform: scale(1.12) rotate(2deg);
    }
  }
</style>
</head>

<body>

<div id="center">
  🍻 9哥下班一起喝大象 🍻
</div>

<script>
function createText() {
  const el = document.createElement("div");

  el.className = "text";
  el.textContent = "9哥下班一起喝大象 🍻🍻🍻🍻";

  el.style.top = Math.random() * 100 + "vh";
  el.style.fontSize = (20 + Math.random() * 35) + "px";
  el.style.animationDuration = (3 + Math.random() * 5) + "s";

  document.body.appendChild(el);

  setTimeout(() => {
    el.remove();
  }, 9000);
}

// 开场大量出现
for (let i = 0; i < 100; i++) {
  setTimeout(createText, i * 50);
}

// 持续生成
setInterval(createText, 150);
</script>

</body>
</html>
