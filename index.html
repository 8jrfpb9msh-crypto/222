<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一定发财 🎉💸💰</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff8dc;
  }

  .money {
    position: fixed;
    left: -300px;
    top: -100px;
    white-space: nowrap;
    font-size: 30px;
    font-weight: bold;
    color: #e63946;
    text-shadow: 2px 2px 0 #ffd166;
    animation: fly linear forwards;
    pointer-events: none;
  }

  @keyframes fly {
    0% {
      transform: translate(0, 0) rotate(-10deg) scale(.7);
      opacity: 0;
    }

    10% {
      opacity: 1;
    }

    50% {
      transform: translate(55vw, 45vh) rotate(15deg) scale(1.2);
    }

    100% {
      transform: translate(120vw, 110vh) rotate(360deg) scale(.8);
      opacity: 0;
    }
  }

  #title {
    position: fixed;
    z-index: 9999;
    width: 100%;
    top: 45%;
    text-align: center;
    font-size: clamp(35px, 8vw, 90px);
    font-weight: 900;
    color: #d4af37;
    text-shadow: 3px 3px 0 #fff, 6px 6px 15px #999;
    animation: pulse 1s infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
  }
</style>
</head>

<body>

<div id="title">一定发财 🎉💸💰</div>

<script>
function createMoney() {
  const el = document.createElement("div");

  el.className = "money";
  el.textContent = "一定发财 🎉💸💰";

  el.style.top = Math.random() * 100 + "vh";
  el.style.fontSize = (22 + Math.random() * 35) + "px";
  el.style.animationDuration = (4 + Math.random() * 5) + "s";

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 10000);
}

// 一开始就铺满
for (let i = 0; i < 80; i++) {
  setTimeout(createMoney, i * 60);
}

// 持续飘动
setInterval(createMoney, 180);
</script>

</body>
</html>
