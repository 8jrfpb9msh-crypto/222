<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>啊板是傻逼 </title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: linear-gradient(
      120deg,
      #ff6b6b,
      #ffd93d,
      #6bcB77,
      #4d96ff,
      #c77dff
    );
    background-size: 500% 500%;
    animation: rainbow 8s ease infinite;
  }

  @keyframes rainbow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .animal {
    position: fixed;
    font-size: 50px;
    user-select: none;
    pointer-events: none;

    animation:
      move 5s linear infinite,
      spin 2s ease-in-out infinite alternate;
  }

  @keyframes move {
    0% {
      transform: translate(-10vw, 0);
    }

    50% {
      transform: translate(55vw, 40vh);
    }

    100% {
      transform: translate(110vw, 90vh);
    }
  }

  @keyframes spin {
    from {
      rotate: -15deg;
      scale: .8;
    }

    to {
      rotate: 15deg;
      scale: 1.3;
    }
  }

  #title {
    position: fixed;
    z-index: 9999;
    width: 100%;
    top: 42%;
    text-align: center;

    font-size: clamp(40px, 10vw, 100px);
    font-weight: 900;

    color: white;
    text-shadow:
      4px 4px 0 #ff4d6d,
      8px 8px 20px #333;

    animation: bounce .7s infinite alternate;
  }

  @keyframes bounce {
    from {
      transform: scale(1);
    }

    to {
      transform: scale(1.12);
    }
  }
</style>
</head>

<body>

<div id="title">啊板是傻逼</div>

<script>
const animals = [
  "🥰", "🥰", "🥰", "🐹",
  "🥰", "🥰", "🥰", "🥰",
  "🥰", "🥰", "🥰", "🥰",
  "🥰", "🥰", "🥰", "🥰",
  "🥰", "🥰", "🥰", "🥰",
  "🥰", "🥰", "🥰", "🥰"
];

function createAnimal() {
  const animal = document.createElement("div");

  animal.className = "animal";
  animal.textContent =
    animals[Math.floor(Math.random() * animals.length)];

  animal.style.left = Math.random() * 100 + "vw";
  animal.style.top = Math.random() * 100 + "vh";

  animal.style.fontSize =
    (30 + Math.random() * 60) + "px";

  animal.style.animationDuration =
    (3 + Math.random() * 6) + "s, " +
    (0.5 + Math.random() * 2) + "s";

  document.body.appendChild(animal);

  setTimeout(() => {
    animal.remove();
  }, 10000);
}

// 开场铺满
for (let i = 0; i < 100; i++) {
  setTimeout(createAnimal, i * 50);
}

// 持续出现
setInterval(createAnimal, 120);
</script>

</body>
</html>
